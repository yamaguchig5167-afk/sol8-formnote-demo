<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フォームノート 体験デモ</title>
<meta name="description" content="ソルエイト株式会社 MAXHUB スポーツ指導の体験デモ。撮る・スローで見る・書き込む・比べる・QRで持ち帰る。">
<style>
:root{
  --ink:#14212B; --sub:#4E5B66; --line:#D5DBE0; --surface:#F2F4F6; --canvas:#FFFFFF;
  --navy:#17365D; --pen:#C8232C; --pen2:#1D5FD1; --pen3:#F2C200; --stage:#1B1F24; --ok:#16785F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"BIZ UDPGothic","Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--ink);background:var(--canvas);
  font-feature-settings:"palt";-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:8px}
.brand b{font-size:24px;letter-spacing:.02em}
.brand small{font-size:13px;color:var(--sub)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px 18px;border-radius:9px;font-size:17px;min-height:48px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--canvas);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,33,43,.18)}
.spacer{flex:1}
.privacy{font-size:13px;color:var(--sub);max-width:300px;line-height:1.4}
main{display:grid;grid-template-columns:1fr 400px;min-height:0}
.left{display:grid;grid-template-rows:auto 1fr auto auto;min-height:0;padding:14px 16px 14px 20px;gap:10px}
.sources{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--canvas);border-radius:12px;padding:10px 18px;min-height:56px;font-size:18px;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.btn.rec{border-color:var(--pen);color:var(--pen);font-weight:700}
.btn.rec.on{background:var(--pen);color:#fff}
.btn svg{width:24px;height:24px;flex:none}
.hint{font-size:15px;color:var(--sub)}
.stage{position:relative;background:var(--stage);border-radius:14px;overflow:hidden;min-height:0;display:grid;grid-template-columns:1fr}
.stage.two{grid-template-columns:1fr 1fr;gap:4px}
.pane{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.pane video{width:100%;height:100%;object-fit:contain;display:block;background:var(--stage)}
.pane .label{position:absolute;left:12px;top:10px;background:rgba(20,33,43,.78);color:#fff;font-size:15px;padding:4px 10px;border-radius:6px;pointer-events:none}
.pane .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C9D1D8;font-size:20px;text-align:center;padding:20px;line-height:1.6;pointer-events:none}
#ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:160px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);pointer-events:none}
.count.show{display:flex}
.ctrl,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ic{border:1px solid var(--line);background:var(--canvas);border-radius:12px;min-width:64px;min-height:60px;padding:6px 12px;font-size:16px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ic svg{width:26px;height:26px}
.ic[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.ic span{font-size:13px;line-height:1}
.speed{display:flex;gap:4px}
.speed .ic{min-width:58px}
#seek{flex:1;min-width:160px;height:48px;accent-color:var(--navy)}
.time{font-variant-numeric:tabular-nums;font-size:16px;color:var(--sub);min-width:96px;text-align:right}
.dot{width:26px;height:26px;border-radius:50%;display:block;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
aside{border-left:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto;background:var(--surface)}
aside h2{font-size:20px;margin:0}
aside .who{font-size:14px;color:var(--sub);margin-top:-6px}
.pt{display:flex;gap:8px;align-items:flex-start}
.pt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:6px}
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;resize:none;line-height:1.45}
textarea:focus,input:focus{outline:3px solid rgba(29,95,209,.35);border-color:var(--pen2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:14px;min-height:40px}
.take{margin-top:auto;border:0;background:var(--pen);color:#fff;border-radius:14px;min-height:76px;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px}
.take svg{width:34px;height:34px}
.note{font-size:13px;color:var(--sub);line-height:1.5}
/* 持ち帰りカード */
.modal{position:fixed;inset:0;background:rgba(20,33,43,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:24px}
.modal.show{display:flex}
.card{background:#fff;border-radius:18px;display:grid;grid-template-columns:1.35fr 1fr;gap:28px;padding:28px;max-width:1500px;width:100%;max-height:100%;overflow:auto}
.card img{width:100%;border-radius:10px;display:block;background:var(--stage)}
.card h3{margin:14px 0 6px;font-size:22px}
.card ol{margin:0;padding-left:1.4em;font-size:19px;line-height:1.6}
.card .drill{margin-top:10px;font-size:17px;background:var(--surface);border-radius:10px;padding:10px 14px}
.qrbox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.qrbox .qr{width:min(100%,420px);aspect-ratio:1;background:#fff;padding:14px;border:1px solid var(--line);border-radius:12px}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox p{margin:0;font-size:20px;font-weight:700}
.qrbox small{font-size:14px;color:var(--sub);line-height:1.55}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:17px;display:none;z-index:20}
.toast.show{display:block}
/* スマホで開いたとき（カード表示） */
.phone{display:none;max-width:560px;margin:0 auto;padding:20px 18px 40px;overflow:auto;height:100%}
body.view .app{display:none}
body.view{overflow:auto}
body.view .phone{display:block}
.phone h1{font-size:24px;margin:6px 0 2px}
.phone .meta{color:var(--sub);font-size:15px}
.phone ol{font-size:18px;line-height:1.7;padding-left:1.3em}
.phone .drill{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px}
.phone footer{margin-top:28px;font-size:13px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px;line-height:1.6}
@media (max-width:1100px){
  body{overflow:auto}
  .app{height:auto}
  main{grid-template-columns:1fr}
  .stage{height:56vw}
  aside{border-left:0;border-top:1px solid var(--line)}
  .privacy{display:none}
  header{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b>フォームノート</b><small>撮る・見る・書く・持ち帰る</small></div>
  <div class="seg" role="group" aria-label="競技">
    <button data-sport="golf" aria-pressed="true">ゴルフ</button>
    <button data-sport="baseball" aria-pressed="false">野球</button>
    <button data-sport="volley" aria-pressed="false">バレーボール</button>
    <button data-sport="other" aria-pressed="false">その他</button>
  </div>
  <div class="seg" role="group" aria-label="画面の数">
    <button id="m1" aria-pressed="true">1画面</button>
    <button id="m2" aria-pressed="false">お手本と比べる</button>
  </div>
  <div class="spacer"></div>
  <div class="privacy">体験デモです。映像はこの画面の中だけで扱い、外へは送りません。</div>
</header>
<main>
  <section class="left">
    <div class="sources">
      <button class="btn rec" id="recBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg><span>撮る（5秒）</span></button>
      <button class="btn" id="openBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h6l2 2h8v10H4z"/></svg>スマホの動画を開く</button>
      <button class="btn" id="sampleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5l11 7-11 7z"/></svg>見本の動画</button>
      <input type="file" id="file" accept="video/*" hidden>
      <span class="hint" id="hint">見本の動画を用意しています…</span>
    </div>
    <div class="stage" id="stage">
      <div class="pane" id="paneA"><video id="vA" playsinline muted></video><div class="label">今日</div><div class="empty" id="emptyA">動画を撮るか、開いてください</div></div>
      <div class="pane" id="paneB" hidden><video id="vB" playsinline muted></video><div class="label">お手本</div><div class="empty" id="emptyB"></div></div>
      <canvas id="ink" aria-label="書き込み"></canvas>
      <div class="count" id="count"></div>
    </div>
    <div class="ctrl">
      <button class="ic" id="play" aria-label="再生"><svg viewBox="0 0 24 24" id="playIc"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg><span id="playTx">再生</span></button>
      <button class="ic" id="back" aria-label="1コマ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg><span>1コマ</span></button>
      <button class="ic" id="fwd" aria-label="1コマ進む"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg><span>1コマ</span></button>
      <div class="speed" role="group" aria-label="再生の速さ">
        <button class="ic" data-rate="1" aria-pressed="true"><b>1</b><span>ふつう</span></button>
        <button class="ic" data-rate="0.5" aria-pressed="false"><b>1/2</b><span>スロー</span></button>
        <button class="ic" data-rate="0.25" aria-pressed="false"><b>1/4</b><span>スロー</span></button>
      </div>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置">
      <div class="time" id="time">0.00 秒</div>
    </div>
    <div class="tools" role="group" aria-label="書き込みの道具">
      <button class="ic" data-tool="pen" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg><span>ペン</span></button>
      <button class="ic" data-tool="line" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 20L20 4"/></svg><span>直線</span></button>
      <button class="ic" data-tool="angle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20h16M4 20L16 5"/><path d="M10 20a6 6 0 0 0-2-4.5"/></svg><span>角度</span></button>
      <button class="ic" data-tool="circle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/></svg><span>丸</span></button>
      <div class="sep"></div>
      <button class="ic" data-color="#C8232C" aria-pressed="true" aria-label="赤"><i class="dot" style="background:#C8232C"></i><span>赤</span></button>
      <button class="ic" data-color="#1D5FD1" aria-pressed="false" aria-label="青"><i class="dot" style="background:#1D5FD1"></i><span>青</span></button>
      <button class="ic" data-color="#F2C200" aria-pressed="false" aria-label="黄"><i class="dot" style="background:#F2C200"></i><span>黄</span></button>
      <div class="sep"></div>
      <button class="ic" id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg><span>戻す</span></button>
      <button class="ic" id="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span>全部消す</span></button>
    </div>
  </section>
  <aside>
    <h2>今日のポイント</h2>
    <div class="who"><input type="text" id="coach" value="担当コーチ" aria-label="コーチの名前"></div>
    <div class="pt"><b>1</b><textarea id="p1" rows="2" maxlength="44"></textarea></div>
    <div class="pt"><b>2</b><textarea id="p2" rows="2" maxlength="44"></textarea></div>
    <div class="pt"><b>3</b><textarea id="p3" rows="2" maxlength="44"></textarea></div>
    <div class="note">よく使う言葉（押すと空いている欄に入ります）</div>
    <div class="chips" id="chips"></div>
    <h2 style="margin-top:6px">次までの練習</h2>
    <textarea id="drill" rows="2" maxlength="60"></textarea>
    <button class="take" id="takeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z" fill="currentColor"/></svg>QRで持ち帰る</button>
  </aside>
</main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="持ち帰りカード">
  <div class="card">
    <div>
      <img id="snap" alt="書き込みを入れた今日の一コマ">
      <h3 id="cTitle">今日のポイント</h3>
      <ol id="cList"></ol>
      <div class="drill" id="cDrill"></div>
    </div>
    <div class="qrbox">
      <p>スマホのカメラで読み取ってください</p>
      <div class="qr" id="qr"></div>
      <small id="qrNote"></small>
      <div class="row">
        <button class="btn" id="saveImg">画像を保存</button>
        <button class="btn primary" id="closeModal">閉じる</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="phone" id="phone">
  <div class="meta" id="vMeta"></div>
  <h1>今日のポイント</h1>
  <ol id="vList"></ol>
  <h2 style="font-size:18px;margin:18px 0 6px">次までの練習</h2>
  <div class="drill" id="vDrill"></div>
  <footer>このページはレッスンで受け取ったメモです。映像は含みません。<br>フォームノート（ソルエイト株式会社の体験デモ）</footer>
</div>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

        return b;

      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }
      }

    };

      let d = a2-a1; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
      const deg = Math.round(Math.abs(d)*180/Math.PI);
      const rr = 46*scale; ctx.beginPath(); ctx.arc(v[0],v[1],rr,a1,a1+d,d<0); ctx.stroke();
      const mid=a1+d/2, tx=v[0]+Math.cos(mid)*(rr+38*scale), ty=v[1]+Math.sin(mid)*(rr+38*scale);
      ctx.shadowBlur=0; ctx.font=`800 ${30*scale}px "BIZ UDPGothic","Noto Sans JP",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      const label = deg+'°', tw = ctx.measureText(label).width+18*scale;
      ctx.fillStyle='rgba(20,33,43,.85)'; ctx.fillRect(tx-tw/2, ty-22*scale, tw, 44*scale);
      ctx.fillStyle='#fff'; ctx.fillText(label, tx, ty+1);
    }
    ctx.shadowBlur=0;
  }
}
function render(){
  const dpr = window.devicePixelRatio||1;
  ictx.clearRect(0,0,ink.width,ink.height);
  const list = cur ? shapes.concat([cur]) : shapes;
  drawShapes(ictx, ink.width, ink.height, list, dpr);
  ictx.fillStyle=color;
  anglePts.forEach(p => { ictx.beginPath(); ictx.arc(p.x*ink.width, p.y*ink.height, 9*dpr, 0, 7); ictx.fill(); });
}

/* ---------- 持ち帰りカード ---------- */
function snapshot(){
  const r = $('#stage').getBoundingClientRect();
  const W = 1600, H = Math.round(W * r.height / r.width);
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d'); x.fillStyle='#1B1F24'; x.fillRect(0,0,W,H);
  const panes = [['#paneA',vA,'今日'],['#paneB',vB,'お手本']].filter(([p])=>!$(p).hidden);
  for (const [p,v,label] of panes){
    const pr = $(p).getBoundingClientRect(), k = W/r.width;
    const bx=(pr.left-r.left)*k, by=(pr.top-r.top)*k, bw=pr.width*k, bh=pr.height*k;
    if (v.videoWidth){
      const s = Math.min(bw/v.videoWidth, bh/v.videoHeight), dw=v.videoWidth*s, dh=v.videoHeight*s;
      try { x.drawImage(v, bx+(bw-dw)/2, by+(bh-dh)/2, dw, dh); } catch(e){}
    }
    x.fillStyle='rgba(20,33,43,.78)'; x.fillRect(bx+14,by+12,label.length*26+24,42);
    x.fillStyle='#fff'; x.font='700 26px "BIZ UDPGothic","Noto Sans JP",sans-serif'; x.textBaseline='middle'; x.fillText(label,bx+26,by+34);
  }
  drawShapes(x, W, H, shapes, W/ r.width);
  return c.toDataURL('image/jpeg', .88);
}
function cardData(){
  const p = ['p1','p2','p3'].map(id=>$('#'+id).value.trim()).filter(Boolean);
  const dt = new Date(); const d = `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
  return { d, s: SPORT[sport].name, c: $('#coach').value.trim(), p, r: $('#drill').value.trim() };
}
function qrSvg(text){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const q = qrcode(0, 'M'); q.addData(text, 'Byte'); q.make();
  const n = q.getModuleCount(); let path='';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) path += `M${c},${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="持ち帰り用のQRコード"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${path}" fill="#14212B"/></svg>`;
}
$('#takeBtn').onclick = () => {
  vA.pause(); vB.pause(); setPlayUI(false);
  const d = cardData();
  if (!d.p.length) return toast('ポイントを1つ以上書いてください');
  $('#snap').src = snapshot();
  $('#cTitle').textContent = `今日のポイント（${d.s}）`;
  const ol=$('#cList'); ol.innerHTML=''; d.p.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; ol.appendChild(li); });
  $('#cDrill').textContent = d.r ? '次までの練習：'+d.r : '';
  let text, note;
  if (/^https?:$/.test(location.protocol)){
    text = location.origin + location.pathname + '#card=' + b64urlEncode(JSON.stringify(d));
    note = '読み取ると、今日のポイントがスマホに開きます（文字だけ。映像は入りません）。本番では、書き込み入りの動画も期限つきのリンクでお渡しします。';
  } else {
    text = `【${d.d} ${d.s}】${d.c?d.c+'より':''}\n` + d.p.map((t,i)=>`${i+1}. ${t}`).join('\n') + (d.r?`\n次までの練習：${d.r}`:'');
    note = '読み取ると、今日のポイントが文字で出ます。メモに貼り付けて残せます。本番では、書き込み入りの動画も期限つきのリンクでお渡しします。';
  }
  try { $('#qr').innerHTML = qrSvg(text); } catch(e){ $('#qr').textContent='文字が多すぎてQRにできません。ポイントを短くしてください'; }
  $('#qrNote').textContent = note;
  $('#modal').classList.add('show');
};
$('#closeModal').onclick = () => $('#modal').classList.remove('show');
$('#modal').onclick = e => { if (e.target.id==='modal') $('#modal').classList.remove('show'); };
$('#saveImg').onclick = () => { const a=document.createElement('a'); a.href=$('#snap').src; a.download='今日のポイント.jpg'; a.click(); };

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }

resize();
prepareSamples();
window.__demo = { setMode, shapes: () => shapes, setShapes: s => { shapes = s; render(); }, vA, vB };
})();
